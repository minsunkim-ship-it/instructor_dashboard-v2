name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test cron auth helper
        run: node --experimental-strip-types --loader ./scripts/ts-path-loader.mjs ./scripts/unit-test-cron-auth.ts

      - name: Test manual satisfaction input parser
        run: node --experimental-strip-types --loader ./scripts/ts-path-loader.mjs ./scripts/unit-test-manual-satisfaction-input.ts
